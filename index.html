<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Muhammad Usmonov" />
    <meta
      name="description"
      content="Muhammad Usmonov — AI Engineer in Tashkent building production LLM, RAG and agent systems in Python, FastAPI and LangGraph, plus the backend services around them."
    />
    <title>Muhammad Usmonov — AI Engineer</title>

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="canonical" href="https://ameer.uz/" />

    <!-- Link previews for LinkedIn, Telegram, X, etc. -->
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://ameer.uz/" />
    <meta property="og:title" content="Muhammad Usmonov — AI Engineer" />
    <meta
      property="og:description"
      content="Production LLM, RAG and agent systems in Python, FastAPI and LangGraph — plus the backend services around them."
    />
    <meta property="og:image" content="https://ameer.uz/favicon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Muhammad Usmonov — AI Engineer" />
    <meta
      name="twitter:description"
      content="Production LLM, RAG and agent systems in Python, FastAPI and LangGraph — plus the backend services around them."
    />
    <meta name="twitter:image" content="https://ameer.uz/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Applies the saved theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
